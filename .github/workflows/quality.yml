name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  QT_QPA_PLATFORM: offscreen
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux Qt and VTK runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0
      - name: Install CoilGen and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui,plot-qt]"
      - name: Check source quality
        run: python -m ruff check src tests projects
      - name: Check source formatting
        run: python -m ruff format --check src tests projects
      - name: Run regression suite
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m pytest -q
