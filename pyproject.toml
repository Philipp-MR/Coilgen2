[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coilgen-python"
version = "0.1.0"
description = "Class-based Python translation of CoilGen."
authors = [{name = "Philipp Amrein"}]
maintainers = [{name = "Philipp Amrein"}]
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Repository = "https://github.com/Philipp-MR/Coilgen2"
"Original CoilGen publication" = "https://doi.org/10.1002/mrm.29294"

[project.scripts]
coilgen = "coilgen.cli:main"
coilgen-gui = "coilgen.gui.__main__:main"

[project.optional-dependencies]
research = [
    "scipy>=1.10",
    "cvxpy>=1.4",
    "threadpoolctl>=3.2",
]
accelerate = [
    "numba>=0.61",
    "threadpoolctl>=3.2",
]
plot = [
    "ipython>=8",
    "matplotlib>=3.7",
]
plot-qt = [
    "ipython>=8",
    "matplotlib>=3.7",
    # Qt 6.12.0 aborts on CPython 3.10; see docs/VALIDATION_2026-10-18.md.
    "PySide6-Essentials>=6.5,<6.12",
]
gui = [
    "PySide6-Essentials>=6.5,<6.12",
    "pyvista>=0.44,<0.50",
    "pyvistaqt>=0.11,<0.12",
    "scipy>=1.10",
    "cvxpy>=1.4",
    "threadpoolctl>=3.2",
]
solver = [
    "cvxpy>=1.4",
]
spatial = [
    "scipy>=1.10",
]
full = [
    "threadpoolctl>=3.2",
    "numba>=0.61",
    "cvxpy>=1.4",
    "h5py>=3.9",
    "ipython>=8",
    "matplotlib>=3.7",
    "pillow>=10",
    "scipy>=1.10",
    "tomli>=2; python_version < '3.11'",
]
dev = [
    "threadpoolctl>=3.2",
    "numba>=0.61",
    "cvxpy>=1.4",
    "h5py>=3.9",
    "ipython>=8",
    "matplotlib>=3.7",
    "pillow>=10",
    "pytest>=7",
    "pytest-cov>=5",
    "ruff==0.15.22",
    "scipy>=1.10",
    "tomli>=2; python_version < '3.11'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"coilgen.gui" = ["assets/coilgen-logo.png", "assets/martinos-logo.png", "assets/ACKNOWLEDGMENTS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
norecursedirs = [
    "CoilGenResearch",
    "tmp",
    ".git",
    ".venv",
    "build",
    "dist",
    "outputs",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "CoilGenResearch",
    "tmp",
    ".venv",
    "build",
    "dist",
    "outputs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Runnable project scripts bootstrap the repository before importing project
# modules so they remain directly executable from Spyder and plain Python.
"projects/**/*.py" = ["E402"]

[tool.ruff.format]
line-ending = "lf"

[tool.coverage.run]
branch = true
source = ["coilgen"]

[tool.coverage.report]
show_missing = true
skip_covered = true
