name: linux-diagnostics

on:
  push:
    paths:
      - .github/workflows/linux-diagnostics.yml

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  QT_QPA_PLATFORM: offscreen
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  PYTHONFAULTHANDLER: "1"
  PYTHONUNBUFFERED: "1"

concurrency:
  group: linux-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: field-sampling
            tests: tests/test_field_sampling.py
          - name: native-workbench
            tests: tests/test_native_workbench.py
          - name: qt-runtime
            tests: ""
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0
      - name: Install dependencies
        run: python -m pip install -e ".[dev,gui,plot-qt]"
      - name: Focused regression diagnostics
        if: matrix.tests != ''
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -X faulthandler -m pytest -vv -s --tb=short ${{ matrix.tests }}
      - name: Qt startup and plugin linkage
        if: matrix.name == 'qt-runtime'
        env:
          QT_DEBUG_PLUGINS: "1"
        run: |
          python -X faulthandler - <<'PY'
          from pathlib import Path
          import subprocess
          import PySide6
          plugin = Path(PySide6.__file__).parent / "Qt/plugins/platforms/libqoffscreen.so"
          print("PySide6", PySide6.__version__, "plugin", plugin, flush=True)
          subprocess.run(["ldd", str(plugin)], check=False)
          from PySide6.QtWidgets import QApplication
          application = QApplication([])
          print("Qt application platform", application.platformName(), flush=True)
          PY
